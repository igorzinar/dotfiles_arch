################
### monitors ###
################

# see https://wiki.hyprland.org/configuring/monitors/

# 1. laptop screen
monitor = eDP-1, 2560x1600@165, 0x0, 1, bitdepth, 10

# 2. lenovo 4k monitor
# using 'desc' so it works on any port/cable.
# copy the exact description from `hyprctl monitors` (it is case-sensitive)
monitor = desc:Lenovo Group Limited L28u-35 U1AKW245, 3840x2160@60, auto, 1

# 3. fallback (for any other random screen)
monitor = , preferred, auto, 1, bitdepth, 10


###################
### my programs ###
###################

$terminal = kitty
$filemanager = nautilus
$menu = wofi --show drun --parse-cache


#################
### autostart ###
#################

exec-once = waybar & swaync & hypridle & hyprpaper & nm-applet
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kanata -c ~/.config/kanata/kanata.kbd

# soft warm filter (5000K, great with catppuccin)
exec-once = hyprsunset --temperature 5000K


#############################
### environment variables ###
#############################

# see https://wiki.hyprland.org/configuring/environment-variables/
# env var names are case-sensitive, keep them UPPERCASE

env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,28
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,28

# nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

#env = ELECTRON_OZONE_PLATFORM_HINT,auto
#env = MOZ_ENABLE_WAYLAND,1
#env = GDK_BACKEND,wayland,x11,*
#env = QT_QPA_PLATFORM,wayland;x11


