#####################
### look and feel ###
#####################

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

cursor {
    no_hardware_cursors = true
}


#############
### input ###
#############

input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### window rules ###
####################

# see https://wiki.hyprland.org/configuring/window-rules/

# xwaylandvideobridge (hide it)
windowrule = match:class ^(xwaylandvideobridge)$, opacity 0.0 override, no_anim on, no_initial_focus on, size 1 1, no_blur on, no_focus on

# suppress maximize requests from all apps
windowrule = match:class .*, suppress_event maximize

# xwayland drag fix
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus on

# zoom: main app (floating, not pinned)
windowrule = match:class ^(zoom)$, float on, no_blur on

# zoom: annotation layer (follows you across workspaces)
windowrule = match:title ^(cpt_frame_window)$, float on, pin on, no_focus on, size monitor_w monitor_h, monitor 0

# zoom: meeting toolbar
windowrule = match:title ^(zoom_share_toolbar)$, float on, pin on

# bitwarden popup in chrome
windowrule = match:class ^(google-chrome)$, match:title ^(Bitwarden).*, float on

# code review popup (lazygit picker)
windowrule = match:class ^(review)$, float on, center on, size monitor_w*0.85 monitor_h*0.85


###################
### keybindings ###
###################

$mainmod = SUPER

# apps
bind = $mainmod, Return, exec, $terminal
bind = $mainmod, E, exec, $filemanager
bind = $mainmod, Space, exec, $menu
bind = $mainmod, G, exec, $terminal --class review -e ~/.local/bin/review

# windows
bind = $mainmod, C, killactive,
bind = $mainmod, M, exit,
bind = $mainmod, V, togglefloating,
bind = $mainmod, F, fullscreen, 0
bind = $mainmod, P, pseudo,
bind = $mainmod, T, layoutmsg, togglesplit

# move focus (vim keys)
bind = $mainmod, H, movefocus, l
bind = $mainmod, L, movefocus, r
bind = $mainmod, K, movefocus, u
bind = $mainmod, J, movefocus, d

# switch workspaces
bind = $mainmod, 1, workspace, 1
bind = $mainmod, 2, workspace, 2
bind = $mainmod, 3, workspace, 3
bind = $mainmod, 4, workspace, 4
bind = $mainmod, 5, workspace, 5
bind = $mainmod, 6, workspace, 6
bind = $mainmod, 7, workspace, 7
bind = $mainmod, 8, workspace, 8
bind = $mainmod, 9, workspace, 9
bind = $mainmod, 0, workspace, 10

# move active window to workspace
bind = $mainmod SHIFT, 1, movetoworkspace, 1
bind = $mainmod SHIFT, 2, movetoworkspace, 2
bind = $mainmod SHIFT, 3, movetoworkspace, 3
bind = $mainmod SHIFT, 4, movetoworkspace, 4
bind = $mainmod SHIFT, 5, movetoworkspace, 5
bind = $mainmod SHIFT, 6, movetoworkspace, 6
bind = $mainmod SHIFT, 7, movetoworkspace, 7
bind = $mainmod SHIFT, 8, movetoworkspace, 8
bind = $mainmod SHIFT, 9, movetoworkspace, 9
bind = $mainmod SHIFT, 0, movetoworkspace, 10

# scratchpad (good place for herdr / dev server)
bind = $mainmod, S, togglespecialworkspace, magic
bind = $mainmod SHIFT, S, movetoworkspace, special:magic

# lock screen
bind = $mainmod SHIFT, L, exec, hyprlock

# screenshots
bind = CTRL SHIFT, 4, exec, hyprshot -m region
bind = CTRL SHIFT, W, exec, hyprshot -m window

# screen temperature
bind = $mainmod SHIFT, F1, exec, pkill hyprsunset; hyprsunset --temperature 6500K
bind = $mainmod SHIFT, F2, exec, pkill hyprsunset; hyprsunset --temperature 5000K
bind = $mainmod SHIFT, F3, exec, pkill hyprsunset; hyprsunset --temperature 3500K
bind = $mainmod SHIFT, F4, exec, pkill hyprsunset

# mouse: scroll workspaces, move/resize windows
bind = $mainmod, mouse_down, workspace, e+1
bind = $mainmod, mouse_up, workspace, e-1
bindm = $mainmod, mouse:272, movewindow
bindm = $mainmod, mouse:273, resizewindow

# volume and brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# media (requires playerctl)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
